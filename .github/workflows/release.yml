name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [main, master]

permissions:
  contents: write

jobs:
  linux:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Pure Data
        run: |
          curl -L https://github.com/pure-data/pure-data/archive/refs/tags/0.55-2.tar.gz -o pd.tar.gz
          tar -xzf pd.tar.gz
          mv pure-data-0.55-2 pd

      - name: Build
        run: make PDINCLUDEDIR=pd/src

      - name: Collect artifacts
        run: |
          mkdir -p dist/mrpeach
          cp -r */*.pd dist/mrpeach/ 2>/dev/null || true
          cp README.deken.pd dist/mrpeach/ 2>/dev/null || true
          cp mrpeach-meta.pd dist/mrpeach/ 2>/dev/null || true
          find . -name "*.pd_linux" -exec cp {} dist/mrpeach/ \;

      - name: Create archive
        run: cd dist && zip -r ../mrpeach-linux-amd64.zip mrpeach

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpeach-linux-amd64
          path: mrpeach-linux-amd64.zip

  windows:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            unzip
            wget
            zip

      - name: Download Pure Data
        run: |
          wget -q http://msp.ucsd.edu/Software/pd-0.55-2.msw.zip -O pd.zip
          unzip -q pd.zip
          mv pd-0.55-2 pd

      - name: Build
        run: make PDINCLUDEDIR=pd/src PDBINDIR=pd/bin

      - name: Collect artifacts
        run: |
          mkdir -p dist/mrpeach
          cp -r */*.pd dist/mrpeach/ 2>/dev/null || true
          cp README.deken.pd dist/mrpeach/ 2>/dev/null || true
          cp mrpeach-meta.pd dist/mrpeach/ 2>/dev/null || true
          find . -name "*.dll" -exec cp {} dist/mrpeach/ \;

      - name: Create archive
        run: cd dist && zip -r ../mrpeach-windows-amd64.zip mrpeach

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpeach-windows-amd64
          path: mrpeach-windows-amd64.zip

  macos:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Pure Data
        run: |
          curl -L https://github.com/pure-data/pure-data/archive/refs/tags/0.55-2.tar.gz -o pd.tar.gz
          tar -xzf pd.tar.gz
          mv pure-data-0.55-2 pd

      - name: Build universal binary
        run: |
          make PDINCLUDEDIR=pd/src \
               arch="x86_64 arm64"

      - name: Collect artifacts
        run: |
          mkdir -p dist/mrpeach
          cp -r */*.pd dist/mrpeach/ 2>/dev/null || true
          cp README.deken.pd dist/mrpeach/ 2>/dev/null || true
          cp mrpeach-meta.pd dist/mrpeach/ 2>/dev/null || true
          find . -name "*.pd_darwin" -exec cp {} dist/mrpeach/ \;

      - name: Create archive
        run: cd dist && zip -r ../mrpeach-macos-universal.zip mrpeach

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpeach-macos-universal
          path: mrpeach-macos-universal.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: |
            artifacts/mrpeach-linux-amd64/mrpeach-linux-amd64.zip
            artifacts/mrpeach-windows-amd64/mrpeach-windows-amd64.zip
            artifacts/mrpeach-macos-universal/mrpeach-macos-universal.zip
